plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.khozin.pembelajarankaidah'
    compileSdk {
        version = release(36)
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Load from local.properties (secure, not committed)
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localProperties.load(new FileInputStream(localPropertiesFile))

                if (localProperties.containsKey('RELEASE_STORE_FILE')) {
                    storeFile file(localProperties.getProperty('RELEASE_STORE_FILE'))
                    storePassword localProperties.getProperty('RELEASE_STORE_PASSWORD')
                    keyAlias localProperties.getProperty('RELEASE_KEY_ALIAS')
                    keyPassword localProperties.getProperty('RELEASE_KEY_PASSWORD')
                    println("Keystore configuration loaded from local.properties")
                } else {
                    println("Warning: No keystore configuration found in local.properties")
                }
            } else {
                println("Warning: local.properties file not found")
            }
        }
    }

    defaultConfig {
        applicationId "com.khozin.pembelajarankaidah"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", '"http://192.168.1.10:8080/api/"'
            buildConfigField "boolean", "DEBUG_MODE", "true"
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
        }
        release {
            buildConfigField "String", "BASE_URL", '"https://pembelajaran-kaidah.minimalmaksimal.my.id/api/"'
            buildConfigField "boolean", "DEBUG_MODE", "true"  // Enable debug mode for logging
            debuggable true  // Enable debugging for troubleshooting
            minifyEnabled false  // Disable minify for now
            shrinkResources false  // Disable shrink for now
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Only apply signing if keystore exists
            if (file('keystore/release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    // Database
    // Room Database removed - using API-only approach

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    // SharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Lifecycle Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}